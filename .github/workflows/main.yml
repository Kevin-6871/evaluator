name: Windows Build & Release

on:
  # 手动触发，可指定 Release 名称和说明
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 名称（留空则使用 tag 或自动生成）'
        required: false
        default: ''
      release_body:
        description: 'Release 详细说明（支持多行）'
        required: false
        default: ''
  # tag 推送时自动触发
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build with MSVC 2022
    runs-on: windows-2022

    env:
      QT_VERSION: 6.8.2
      QT_ARCH: win64_msvc2022_64
      EXE_NAME: QT.exe
      RELEASE_DIR: rele

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以获取 tag 信息

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          setup-python: false
          # 移除废弃的 cached 参数

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build with qmake and nmake
        shell: cmd
        run: |
          qmake QT.pro CONFIG+=release CONFIG+=qtquickcompiler
          nmake

      - name: Prepare release directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null
          Copy-Item -Path "release\$env:EXE_NAME" -Destination $env:RELEASE_DIR -Force
          # 复制依赖（windeployqt 将在下一步处理）
          echo "RELEASE_DIR=$env:RELEASE_DIR" >> $env:GITHUB_ENV

      - name: Deploy dependencies with windeployqt
        shell: pwsh
        run: |
          $qtBinDir = "$env:QT_ROOT_DIR\bin"
          $releaseDir = "$env:RELEASE_DIR"
          $exe = "$env:EXE_NAME"
          Set-Location $releaseDir
          & "$qtBinDir\windeployqt.exe" $exe --release --compiler-runtime -no-translations --dir .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::windeployqt failed, falling back to manual copy."
            $dlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll", "Qt6Qml.dll", "Qt6Quick.dll")
            foreach ($dll in $dlls) {
              $src = Join-Path $qtBinDir $dll
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination . -Force
              }
            }
            $platformSrc = Join-Path $env:QT_ROOT_DIR "plugins\platforms\qwindows.dll"
            if (Test-Path $platformSrc) {
              New-Item -ItemType Directory -Force -Path "platforms" | Out-Null
              Copy-Item -Path $platformSrc -Destination "platforms\" -Force
            }
          }

      # 上传构建产物作为 Artifact（用于调试或后续使用）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtBuild-Windows-msvc2022
          path: ${{ env.RELEASE_DIR }}

      # 发布到 GitHub Release
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_name != '') ||
          startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          body: ${{ github.event.inputs.release_body || '' }}
          files: |
            ${{ env.RELEASE_DIR }}/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
