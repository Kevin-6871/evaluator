name: Windows

on:
  push:
    paths:
      - '*.pro'
      - 'src/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '*.pro'
      - 'src/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    name: Build
    runs-on: windows-2019
    strategy:
      matrix:
        include:
          - qt_ver: 5.9.9
            qt_arch: win32_msvc2015
            msvc_arch: x86
          - qt_ver: 5.9.9
            qt_arch: win64_msvc2017_64
            msvc_arch: x64
          - qt_ver: 5.12.10
            qt_arch: win32_msvc2017
            msvc_arch: x86
          - qt_ver: 5.12.10
            qt_arch: win64_msvc2017_64
            msvc_arch: x64
          - qt_ver: 5.15.2
            qt_arch: win32_msvc2019
            msvc_arch: x86
          - qt_ver: 5.15.2
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
          - qt_ver: 6.0.0
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
          - qt_ver: 6.2.2
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
    env:
      targetName: HelloActions-Qt.exe
      archiveName: ${{ matrix.qt_ver }}-${{ matrix.qt_arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          setup-python: false
          cached: false
          aqtversion: '==2.0.5'

      # 设置 MSVC 环境（使用 ilammy/msvc-dev-cmd 更简洁）
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # 构建（qmake + nmake）
      - name: Build with qmake and nmake
        shell: cmd
        run: |
          qmake QT.pro CONFIG+=release CONFIG+=qtquickcompiler
          nmake

      # 准备发布目录并复制可执行文件
      - name: Prepare release directory
        shell: pwsh
        run: |
          $releaseDir = "rele"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path "release\$env:targetName" -Destination $releaseDir -Force
          echo "RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV
          echo "Release directory prepared."

      # 运行 windeployqt 部署依赖
      - name: Deploy dependencies with windeployqt
        shell: pwsh
        run: |
          $qtBinDir = "$env:QT_ROOT_DIR\bin"
          $releaseDir = "$env:RELEASE_DIR"
          $exe = "$env:targetName"
          Set-Location $releaseDir
          & "$qtBinDir\windeployqt.exe" $exe --release --compiler-runtime -no-translations --dir .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::windeployqt failed, falling back to manual copy."
            # 手动复制关键 DLL（备用方案）
            $dlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll", "Qt6Qml.dll", "Qt6Quick.dll")
            foreach ($dll in $dlls) {
              $src = Join-Path $qtBinDir $dll
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination . -Force
              }
            }
            $platformSrc = Join-Path $env:QT_ROOT_DIR "plugins\platforms\qwindows.dll"
            if (Test-Path $platformSrc) {
              New-Item -ItemType Directory -Force -Path "platforms" | Out-Null
              Copy-Item -Path $platformSrc -Destination "platforms\" -Force
            }
          }

      # 打包成 zip
      - name: Create archive
        shell: pwsh
        run: |
          $archive = "$env:archiveName.zip"
          Compress-Archive -Path "$env:RELEASE_DIR\*" -DestinationPath $archive
          echo "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          echo "Archive created: $archive"

      # 上传 artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archiveName }}
          path: ${{ env.ARCHIVE_PATH }}

      # 如果是 tag 推送，则上传到 Release
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE_PATH }}
          asset_name: ${{ env.ARCHIVE_PATH }}
          tag: ${{ github.ref }}
          overwrite: true
