name: Windows Build & Release

on:
  # 手动触发，需要输入 tag 和可选的 release 名称
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 的 Tag 标签 (v x.x.x)'
        required: true
        default: 'manual-release'
      release_name:
        description: 'Release 标题(可选)'
        required: false
        default: ''
  # tag 推送时自动触发
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build with MSVC 2022
    runs-on: windows-2022

    env:
      QT_VERSION: 6.8.2
      QT_ARCH: win64_msvc2022_64
      EXE_NAME: QT.exe
      RELEASE_DIR: rele

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以获取 tag 信息

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          setup-python: false

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build with qmake and nmake
        shell: cmd
        run: |
          qmake QT.pro CONFIG+=release CONFIG+=qtquickcompiler
          nmake

      - name: Prepare release directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null
          Copy-Item -Path "release\$env:EXE_NAME" -Destination $env:RELEASE_DIR -Force
          echo "RELEASE_DIR=$env:RELEASE_DIR" >> $env:GITHUB_ENV

      - name: Deploy dependencies with windeployqt
        shell: pwsh
        run: |
          $qtBinDir = "$env:QT_ROOT_DIR\bin"
          $releaseDir = "$env:RELEASE_DIR"
          $exe = "$env:EXE_NAME"
          Set-Location $releaseDir
          & "$qtBinDir\windeployqt.exe" $exe --release --compiler-runtime -no-translations --dir .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::windeployqt failed, falling back to manual copy."
            $dlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll", "Qt6Qml.dll", "Qt6Quick.dll")
            foreach ($dll in $dlls) {
              $src = Join-Path $qtBinDir $dll
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination . -Force
              }
            }
            $platformSrc = Join-Path $env:QT_ROOT_DIR "plugins\platforms\qwindows.dll"
            if (Test-Path $platformSrc) {
              New-Item -ItemType Directory -Force -Path "platforms" | Out-Null
              Copy-Item -Path $platformSrc -Destination "platforms\" -Force
            }
          }

      - name: Upload artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: QtBuild-Windows-msvc2022
          path: ${{ env.RELEASE_DIR }}

      # ---------- 读取 Release 说明文件 ----------
      - name: Read release body from explain.txt
        id: read_body
        shell: pwsh
        run: |
          $bodyFile = "./explain.txt"
          if (Test-Path $bodyFile) {
            $content = Get-Content $bodyFile -Raw
            # 写入 GITHUB_OUTPUT 以支持多行
            echo "BODY<<EOF" >> $env:GITHUB_OUTPUT
            echo "$content" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::explain.txt not found, using empty body."
            echo "BODY=" >> $env:GITHUB_OUTPUT
          }

      # ---------- 创建 Release 并上传资产 ----------
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        # 手动触发时要求 tag 输入不为空；tag 推送时自动触发
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') ||
          startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.read_body.outputs.BODY }}
          files: |
            ${{ env.RELEASE_DIR }}/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          # 如果希望覆盖同名已存在的 Release，取消下面注释：
          # overwrite: true
