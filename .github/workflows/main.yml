name: Windows Build (MSVC 2022)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build with MSVC 2022
    runs-on: windows-2022

    env:
      QT_VERSION: '6.8.2'            # 可改为你需要的版本，如 6.11.2
      QT_ARCH: 'win64_msvc2022_64'
      EXE_NAME: 'HelloActions-Qt.exe'
      ARCHIVE_NAME: 'QtBuild-Windows-msvc2022'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          setup-python: false
          cached: false

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build with qmake and nmake
        shell: cmd
        run: |
          qmake QT.pro CONFIG+=release CONFIG+=qtquickcompiler
          nmake

      - name: Prepare release directory
        shell: pwsh
        run: |
          $releaseDir = "rele"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path "release\$env:EXE_NAME" -Destination $releaseDir -Force
          echo "RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV

      - name: Deploy dependencies with windeployqt
        shell: pwsh
        run: |
          $qtBinDir = "$env:QT_ROOT_DIR\bin"
          $releaseDir = "$env:RELEASE_DIR"
          $exe = "$env:EXE_NAME"
          Set-Location $releaseDir
          & "$qtBinDir\windeployqt.exe" $exe --release --compiler-runtime -no-translations --dir .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::windeployqt failed, falling back to manual copy."
            $dlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll", "Qt6Qml.dll", "Qt6Quick.dll")
            foreach ($dll in $dlls) {
              $src = Join-Path $qtBinDir $dll
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination . -Force
              }
            }
            $platformSrc = Join-Path $env:QT_ROOT_DIR "plugins\platforms\qwindows.dll"
            if (Test-Path $platformSrc) {
              New-Item -ItemType Directory -Force -Path "platforms" | Out-Null
              Copy-Item -Path $platformSrc -Destination "platforms\" -Force
            }
          }

      - name: Create archive
        shell: pwsh
        run: |
          $archive = "$env:ARCHIVE_NAME.zip"
          Compress-Archive -Path "$env:RELEASE_DIR\*" -DestinationPath $archive
          echo "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_PATH }}
